name: publish

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the site
        run: |
          mkdir -p public
          cp -r index.html style.css manifest.json favicon.ico images js serviceWorker.js public/
          cp -r docs public/docs
          cp CNAME public/
          find public -name '.DS_Store' -delete

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
