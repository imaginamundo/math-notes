name: publish

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the site
        run: |
          mkdir -p public
          cp -r index.html style.css manifest.json favicon.ico robots.txt sitemap.xml images js public/
          find public -name '.DS_Store' -delete

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
